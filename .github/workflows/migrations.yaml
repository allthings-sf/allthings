name: Migration numbers

# Two migrations must never take one number (core/src/migration-guard.ts).
# On every pull request, a migration it adds must not take a number another
# open pull request adds. On main, core's migrations must also extend what
# production has applied, in order, read from effect_sql.migrations as the
# read-only site_reader role. A failure says what to renumber, and to what.
#
# Production's credential (NEON_READER_URL) is a secret of the
# production-read environment, which only main may use, so no pull
# request's code ever runs with it, whoever opens it. A pull request is
# checked against main's migrations and every other open pull request's;
# main's run checks production once it merges.
on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: 🔢 Migration numbers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 📥 Download core deps
        working-directory: core
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"

      - name: 🔢 Check migration numbers against open pull requests
        working-directory: core
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NO_PRODUCTION_OK: "true"
        run: bun run --silent migration-guard

  production:
    name: 🔢 Migration numbers (production)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production-read
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 📥 Download core deps
        working-directory: core
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"

      - name: 🔢 Check migration numbers against production and open pull requests
        working-directory: core
        env:
          DATABASE_URL: ${{ secrets.NEON_READER_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run --silent migration-guard
