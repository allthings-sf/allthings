name: Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-pr:
    name: Check deploy credential isolation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the deploy token to be absent outside its environment
        env:
          TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: test "$TOKEN_PRESENT" = false

  deploy:
    name: 🚀 Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # Read the last successful staging run before updating the Worker.
    concurrency:
      group: deploy-staging
      # A pending approval can outlast several main pushes. Keep each staging run.
      queue: max
      cancel-in-progress: false
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse to roll staging back to an older main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Queue order follows arrival, which can differ from commit order.
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yaml/runs?event=push&branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          if [[ -n "$last" ]] && ! git merge-base --is-ancestor "$last" "$GITHUB_SHA"; then
            echo "::error::Staging already passed $last. Refusing to deploy older or unrelated $GITHUB_SHA."
            exit 1
          fi

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 📥 Download deps
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"
          (cd infra && bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh")

      - name: 🧱 Build web
        working-directory: web
        run: bun run build

      - name: 🚀 Deploy
        id: deploy
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The origin of the stage's Hyperdrive: production's Neon database
          # as its read-only role.
          NEON_READER_URL: ${{ secrets.NEON_READER_URL }}
        run: |
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          bun alchemy deploy --stage staging --yes --no-input > "$log" 2>&1 || {
            status=$?
            reason="check the staging stack and Alchemy state"
            if grep -Eqi 'unauthorized|forbidden|authentication|permission denied|authorization' "$log"; then
              reason="check the environment credential and Cloudflare grants"
            elif grep -Eqi 'timed out|timeout|ECONNRESET|fetch failed' "$log"; then
              reason="check connectivity to Cloudflare and the state store"
            fi
            echo "::error::Staging deploy failed (exit $status). Next step: $reason."
            exit "$status"
          }
          # The stack returns the Web Worker's URL as its webUrl output.
          url=$(sed -nE "s/^ *webUrl: '(https:[^']+)'.*/\1/p" "$log" | tail -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed \`staging\`: $url" >> "$GITHUB_STEP_SUMMARY"
