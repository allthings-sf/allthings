name: Deploy to Pages

on:
    push:
        branches: ['main']
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: 'pages'
    cancel-in-progress: false

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: ⬇️ Checkout repo
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0
                  fetch-tags: false
                  persist-credentials: false

            - name: 📦 Setup Pages
              uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

            - name: 🦾 Upload artifact
              uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
              with:
                  path: 'pages/'

            # Right after the upload, deploy-pages sometimes finds no
            # github-pages artifact in this run and fails before it creates a
            # deployment ("Fetching artifact metadata failed"): GitHub's
            # artifact listing lags the upload. One more try after a pause
            # absorbs that; a failure that lasts still fails the job.
            - name: 🚢 Deploy to GitHub Pages
              id: deployment
              continue-on-error: true
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

            - name: ⏳ Wait for the artifact to be listed
              if: steps.deployment.outcome == 'failure'
              run: sleep 30

            - name: 🚢 Deploy to GitHub Pages, once more
              id: deployment-retry
              if: steps.deployment.outcome == 'failure'
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
