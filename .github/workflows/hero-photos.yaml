name: Hero photos

# Home's slash grid and the home lab show a wall of hand-picked photos,
# and the lab faces (core/backfill/wall-photos.json, faces.json).
# Core's hero-photos check (core/scripts/hero-photos.ts) reads production as
# the read-only site_reader role and fails if a page can't show one of them:
# an image that is gone, off media.allthings.dev, not the named evening's,
# or of an evening that is a draft, someone else's, or still ahead; or a
# face without a photo there, or who hasn't been on stage. It runs on
# main and weekly, since production can change under the file. It doesn't
# run on pull requests: NEON_READER_URL is a secret of the production-read
# environment, which only main may use, so no pull request's code runs
# with it. A pull request that changes the photos is checked by main's run
# once it merges, or before, by `bun run hero-photos` in core/ with
# DATABASE_URL set.
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hero-photos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 🖼️ Hero photos
    runs-on: ubuntu-latest
    environment: production-read
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 📥 Download core deps
        working-directory: core
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"

      - name: 🖼️ Check every hand-picked photo and face can be shown
        working-directory: core
        env:
          DATABASE_URL: ${{ secrets.NEON_READER_URL }}
        run: bun run --silent hero-photos
